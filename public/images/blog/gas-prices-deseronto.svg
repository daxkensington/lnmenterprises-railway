<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
  </g>
  <!-- Gas price sign icon -->
  <g transform="translate(400,150)" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sign board -->
    <rect x="-55" y="-55" width="110" height="80" rx="6" fill="#dc262618"/>
    <!-- Price display -->
    <text x="0" y="-20" text-anchor="middle" fill="#dc2626" font-family="Inter,sans-serif" font-size="36" font-weight="800">¢</text>
    <text x="0" y="8" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="12" font-weight="600">/litre</text>
    <!-- Post -->
    <line x1="0" y1="25" x2="0" y2="60" stroke-width="4"/>
    <!-- Down arrows (cheap prices) -->
    <path d="M-30,45 L-22,58 L-14,45" stroke="#16a34a" stroke-width="2.5"/>
    <path d="M14,45 L22,58 L30,45" stroke="#16a34a" stroke-width="2.5"/>
    <!-- Map pin dots -->
    <circle cx="-60" cy="-70" r="3" fill="#dc262660"/>
    <circle cx="55" cy="-65" r="3" fill="#dc262660"/>
    <circle cx="-45" cy="55" r="3" fill="#dc262660"/>
    <circle cx="50" cy="50" r="3" fill="#dc262660"/>
  </g>
  <text x="400" y="280" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="26" font-weight="800">CHEAPEST GAS NEAR THE 401</text>
  <text x="400" y="310" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="16">Deseronto &amp; Tyendinaga fuel price guide</text>
  <rect x="350" y="330" width="100" height="3" rx="1.5" fill="url(#accent)"/>
</svg>