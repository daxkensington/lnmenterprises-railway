<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
  </g>
  <!-- Shopping bag icon -->
  <g transform="translate(400,155)" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bag -->
    <path d="M-40,0 L-45,65 Q-45,72 -38,72 L38,72 Q45,72 45,65 L40,0 Z" fill="#dc262615"/>
    <!-- Handle -->
    <path d="M-18,0 L-18,-20 Q-18,-38 0,-38 Q18,-38 18,-20 L18,0"/>
    <!-- Items peeking out -->
    <rect x="-20" y="-5" width="12" height="25" rx="3" fill="#dc262630" stroke="#dc2626" stroke-width="2"/>
    <circle cx="8" cy="8" r="10" fill="#dc262620" stroke="#dc2626" stroke-width="2"/>
    <rect x="22" y="0" width="8" height="20" rx="2" fill="#dc262625" stroke="#dc2626" stroke-width="2"/>
    <!-- Check mark -->
    <path d="M-8,35 L-2,42 L10,28" stroke="#16a34a" stroke-width="3"/>
  </g>
  <text x="400" y="290" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="28" font-weight="800">STORE GUIDE</text>
  <text x="400" y="320" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="16">Snacks, drinks &amp; everyday essentials</text>
  <rect x="350" y="340" width="100" height="3" rx="1.5" fill="url(#accent)"/>
</svg>