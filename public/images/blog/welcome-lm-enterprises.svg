<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="133" y1="0" x2="133" y2="450"/><line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/><line x1="533" y1="0" x2="533" y2="450"/>
    <line x1="666" y1="0" x2="666" y2="450"/>
  </g>
  <!-- Storefront icon -->
  <g transform="translate(400,165)" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Building -->
    <rect x="-60" y="-20" width="120" height="80" rx="4" fill="#dc262615"/>
    <line x1="-60" y1="-20" x2="60" y2="-20"/>
    <!-- Awning -->
    <path d="M-70,-20 L-70,-35 Q-52,-48 -35,-35 Q-17,-48 0,-35 Q17,-48 35,-35 Q52,-48 70,-35 L70,-20" fill="#dc262620"/>
    <!-- Door -->
    <rect x="-12" y="15" width="24" height="45" rx="2"/>
    <circle cx="8" cy="38" r="2" fill="#dc2626"/>
    <!-- Windows -->
    <rect x="-50" y="-5" width="28" height="25" rx="2"/>
    <rect x="22" y="-5" width="28" height="25" rx="2"/>
    <!-- Open sign -->
    <rect x="-8" y="2" width="16" height="8" rx="2" fill="#dc2626"/>
    <text x="0" y="9" text-anchor="middle" fill="#fff" font-family="Inter,sans-serif" font-size="5" font-weight="700">OPEN</text>
  </g>
  <!-- Text -->
  <text x="400" y="290" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">NOW ONLINE</text>
  <text x="400" y="320" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="16" font-weight="400">L&amp;M Enterprises • Deseronto, ON</text>
  <!-- Red accent bar -->
  <rect x="350" y="340" width="100" height="3" rx="1.5" fill="url(#accent)"/>
</svg>