<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af20"/>
      <stop offset="100%" stop-color="#1e40af08"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
  </g>
  <!-- Bridge icon (Skyway Bridge) -->
  <g transform="translate(400,145)" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bridge deck -->
    <path d="M-90,20 L-60,-10 L-20,-30 L20,-30 L60,-10 L90,20" fill="#dc262612" stroke-width="3"/>
    <!-- Road surface -->
    <line x1="-90" y1="20" x2="90" y2="20" stroke-width="4" stroke="#dc262640"/>
    <!-- Support cables -->
    <line x1="-60" y1="-10" x2="-60" y2="20" stroke-width="1.5" opacity="0.5"/>
    <line x1="-40" y1="-20" x2="-40" y2="20" stroke-width="1.5" opacity="0.5"/>
    <line x1="40" y1="-20" x2="40" y2="20" stroke-width="1.5" opacity="0.5"/>
    <line x1="60" y1="-10" x2="60" y2="20" stroke-width="1.5" opacity="0.5"/>
    <!-- Tower pylons -->
    <line x1="-20" y1="-50" x2="-20" y2="20" stroke-width="3"/>
    <line x1="20" y1="-50" x2="20" y2="20" stroke-width="3"/>
    <!-- Top cables -->
    <path d="M-20,-50 L0,-42 L20,-50" stroke-width="2"/>
    <!-- Water underneath -->
    <path d="M-100,35 Q-75,30 -50,35 Q-25,40 0,35 Q25,30 50,35 Q75,40 100,35" stroke="#1e40af" stroke-width="1.5" opacity="0.3"/>
    <path d="M-100,42 Q-75,37 -50,42 Q-25,47 0,42 Q25,37 50,42 Q75,47 100,42" stroke="#1e40af" stroke-width="1" opacity="0.2"/>
    <!-- Wine glass (County = wine country) -->
    <g transform="translate(0,60)">
      <path d="M-8,-15 L-5,0 Q0,5 5,0 L8,-15" stroke="#dc2626" stroke-width="2" fill="#dc262615"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#dc2626" stroke-width="2"/>
      <line x1="-6" y1="12" x2="6" y2="12" stroke="#dc2626" stroke-width="2"/>
    </g>
  </g>
  <text x="400" y="290" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="24" font-weight="800">PRINCE EDWARD COUNTY</text>
  <text x="400" y="320" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="16">Your last stop before the Skyway Bridge</text>
  <rect x="350" y="340" width="100" height="3" rx="1.5" fill="url(#accent)"/>
</svg>