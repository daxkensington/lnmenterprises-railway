<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
  </g>
  <!-- Vape device icon -->
  <g transform="translate(400,155)" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Device body -->
    <rect x="-15" y="-45" width="30" height="80" rx="8" fill="#dc262615"/>
    <!-- Mouthpiece -->
    <rect x="-10" y="-55" width="20" height="14" rx="5" fill="#dc262625"/>
    <!-- Button -->
    <circle cx="0" cy="-5" r="5" fill="#dc262630" stroke="#dc2626"/>
    <!-- LED indicator -->
    <circle cx="0" cy="22" r="3" fill="#dc2626" opacity="0.6"/>
    <!-- Vapor clouds -->
    <circle cx="-15" cy="-68" r="8" fill="#94a3b820" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
    <circle cx="5" cy="-75" r="10" fill="#94a3b815" stroke="#94a3b8" stroke-width="1.5" opacity="0.4"/>
    <circle cx="-8" cy="-85" r="6" fill="#94a3b810" stroke="#94a3b8" stroke-width="1.5" opacity="0.3"/>
    <!-- Tobacco leaf (left side) -->
    <g transform="translate(-55,0)">
      <path d="M0,-30 Q-15,-15 -10,10 Q-5,5 0,0 Q5,5 10,10 Q15,-15 0,-30Z" fill="#dc262612" stroke="#dc2626" stroke-width="2"/>
      <line x1="0" y1="-25" x2="0" y2="5" stroke="#dc2626" stroke-width="1.5"/>
    </g>
    <!-- Tobacco leaf (right side) -->
    <g transform="translate(55,0)">
      <path d="M0,-30 Q-15,-15 -10,10 Q-5,5 0,0 Q5,5 10,10 Q15,-15 0,-30Z" fill="#dc262612" stroke="#dc2626" stroke-width="2"/>
      <line x1="0" y1="-25" x2="0" y2="5" stroke="#dc2626" stroke-width="1.5"/>
    </g>
  </g>
  <text x="400" y="290" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="28" font-weight="800">VAPE &amp; TOBACCO</text>
  <text x="400" y="320" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="16">Your guide to our product selection</text>
  <rect x="350" y="340" width="100" height="3" rx="1.5" fill="url(#accent)"/>
</svg>