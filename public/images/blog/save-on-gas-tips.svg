<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>
  <!-- Fuel pump icon -->
  <g transform="translate(400,160)" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pump body -->
    <rect x="-35" y="-50" width="50" height="70" rx="5" fill="#dc262615"/>
    <rect x="-28" y="-40" width="36" height="22" rx="3" fill="#dc262610" stroke="#dc2626"/>
    <!-- Dollar sign in display -->
    <text x="-10" y="-23" text-anchor="middle" fill="#dc2626" font-family="Inter,sans-serif" font-size="18" font-weight="700">$</text>
    <!-- Nozzle -->
    <path d="M15,-30 Q35,-30 35,-10 L35,10" stroke-width="3"/>
    <path d="M30,10 L40,10 L40,20 L30,20" fill="#dc262630"/>
    <!-- Hose -->
    <path d="M15,-10 Q25,-10 25,0 Q25,10 35,10" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- Base -->
    <rect x="-40" y="20" width="60" height="8" rx="3" fill="#dc262620"/>
    <!-- Down arrow (savings) -->
    <path d="M-10,40 L0,55 L10,40" stroke="#16a34a" stroke-width="3" fill="none"/>
    <line x1="0" y1="30" x2="0" y2="55" stroke="#16a34a" stroke-width="3"/>
  </g>
  <text x="400" y="280" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="28" font-weight="800">5 WAYS TO SAVE</text>
  <text x="400" y="310" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="16">Smart fuel tips for spring driving</text>
  <rect x="350" y="330" width="100" height="3" rx="1.5" fill="url(#accent)"/>
</svg>