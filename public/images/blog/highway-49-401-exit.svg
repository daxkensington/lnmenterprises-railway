<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
  </g>
  <!-- Highway exit sign -->
  <g transform="translate(400,140)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Green highway sign -->
    <rect x="-70" y="-50" width="140" height="55" rx="5" fill="#166534" stroke="#16a34a" stroke-width="2"/>
    <rect x="-65" y="-46" width="130" height="47" rx="3" fill="none" stroke="#ffffff30" stroke-width="1.5"/>
    <text x="0" y="-25" text-anchor="middle" fill="#fff" font-family="Inter,sans-serif" font-size="14" font-weight="700">EXIT → HWY 49</text>
    <text x="0" y="-8" text-anchor="middle" fill="#fff" font-family="Inter,sans-serif" font-size="11" font-weight="500">DESERONTO</text>
    <!-- Sign post -->
    <line x1="0" y1="5" x2="0" y2="40" stroke="#94a3b8" stroke-width="4"/>
    <!-- Road lines -->
    <line x1="-120" y1="60" x2="120" y2="60" stroke="#94a3b850" stroke-width="2"/>
    <line x1="-80" y1="60" x2="-60" y2="60" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="-30" y1="60" x2="-10" y2="60" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="20" y1="60" x2="40" y2="60" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="70" y1="60" x2="90" y2="60" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <!-- Arrow pointing to exit -->
    <path d="M60,30 L80,15 L80,22 L100,22 L100,38 L80,38 L80,45 Z" fill="#dc2626" opacity="0.6"/>
  </g>
  <text x="400" y="280" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="26" font-weight="800">YOUR BEST 401 FUEL STOP</text>
  <text x="400" y="310" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="16">Kingston to Belleville — 5 min detour</text>
  <rect x="350" y="330" width="100" height="3" rx="1.5" fill="url(#accent)"/>
</svg>